query getMoreThreadItems($offset: Int, $threadId: Int!){
  getAllThreadItems(offset: $offset, threadId: $threadId) {
    id
    threadId
    reservationId
    content
    sentBy
    type
    startDate
    endDate
    createdAt
    status
    isRead
    rent
    transfer
    nutrition
    huntsman
    assistant
    addition
    isApproved
  }
}